# Drop-in for tailscaled.service, installed by apply.sh at
# /etc/systemd/system/tailscaled.service.d/agent-cage-guard.conf.
# tailscaled installs its firewall rules a few seconds after it reports ready. Re-asserting
# immediately would land the cage's rules underneath Tailscale's again, hence the sleep.
[Service]
ExecStartPost=/bin/sh -c 'sleep 5; /usr/bin/env bash @CAGE_DIR@/tailnet-guard.sh'
