name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install (no dependencies; checks the lockfile)
        run: npm ci
      - name: Run every test (no Docker, no root, no network)
        run: npm test

  drills:
    # The fire drills in real containers: caged, open and mixed, each verdict checked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: verify-cage.sh in three containers
        run: npm run test:docker
